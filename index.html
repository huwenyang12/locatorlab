            item.appendChild(header);
            item.appendChild(breadcrumb);

            const previewText = truncateText(getNodePreviewText(node), 100);
            if (previewText) {
                const preview = document.createElement('div');
                preview.className = 'item-text';
                preview.textContent = previewText;
                item.appendChild(preview);
            }

            if (node.nodeType === Node.ELEMENT_NODE && node.attributes) {
                const attrs = Array.from(node.attributes).filter(attr =>
                    ['id', 'class', 'href', 'src', 'name', 'type'].includes(attr.name) || attr.name.startsWith('data-')
                );

                if (attrs.length > 0) {
                    const attrWrap = document.createElement('div');
                    attrWrap.className = 'item-attrs';

                    attrs.forEach(attr => {
                        const badge = document.createElement('span');
                        badge.className = 'attr-badge';
                        badge.textContent = `${attr.name}=`;

                        const value = document.createElement('span');
                        value.className = 'attr-value';
                        value.textContent = `"${attr.value}"`;

                        badge.appendChild(value);
                        attrWrap.appendChild(badge);
                    });

                    item.appendChild(attrWrap);
                }
            }

            renderPlaywrightBlock(item, node, index, normalizedNodes.length, cssSelector, xpathSelector);

            const toggle = document.createElement('div');
            toggle.className = 'toggle-code-btn';
            toggle.textContent = i18n[currentLang].showHide;

            const code = document.createElement('div');
            code.className = 'item-code';
            code.textContent = truncateCode(getNodeMarkup(node), 500);

            toggle.addEventListener('click', event => {
                event.stopPropagation();
                code.classList.toggle('visible');
            });

            item.appendChild(toggle);
            item.appendChild(code);
            fragment.appendChild(item);
        });

        resultList.appendChild(fragment);
        syncResultCardState();
        restoreLockedHighlight();
        syncPreviewMatchesFromInputs();
    }

    function evaluateXPath(xpath) {
        const result = currentDoc.evaluate(xpath, currentDoc, null, XPathResult.ANY_TYPE, null);

        if (result.resultType === XPathResult.STRING_TYPE) {
            return { kind: 'scalar', valueType: 'string', value: result.stringValue };
        }

        if (result.resultType === XPathResult.NUMBER_TYPE) {
            return { kind: 'scalar', valueType: 'number', value: result.numberValue };
        }

        if (result.resultType === XPathResult.BOOLEAN_TYPE) {
            return { kind: 'scalar', valueType: 'boolean', value: result.booleanValue };
        }

        if (result.resultType === XPathResult.ANY_UNORDERED_NODE_TYPE || result.resultType === XPathResult.FIRST_ORDERED_NODE_TYPE) {
            return { kind: 'nodes', nodes: result.singleNodeValue ? [result.singleNodeValue] : [] };
        }

        const nodes = [];
        let current = result.iterateNext();
        while (current) {
            nodes.push(current);
            current = result.iterateNext();
        }

        return { kind: 'nodes', nodes };
    }

    function runCSS() {
        cssError.textContent = '';
        const selector = cssInput.value.trim();

        if (!selector) {
            renderEmptyState(i18n[currentLang].inputPrompt);
            return;
        }

        if (!ensureCurrentDocument()) {
            renderEmptyState(i18n[currentLang].inputPrompt);
            return;
        }

        try {
            renderResults(Array.from(currentDoc.querySelectorAll(selector)));
        } catch (error) {
            cssError.textContent = i18n[currentLang].invalidCss;
            renderResults([]);
        }
    }

    function runXPath() {
        xpathError.textContent = '';
        const xpath = xpathInput.value.trim();

        if (!xpath) {
            renderEmptyState(i18n[currentLang].inputPrompt);
            return;
        }

        if (!ensureCurrentDocument()) {
            renderEmptyState(i18n[currentLang].inputPrompt);
            return;
        }

        try {
            const outcome = evaluateXPath(xpath);
            if (outcome.kind === 'scalar') {
                renderXPathScalarResult(outcome.value, outcome.valueType);
                return;
            }
            renderResults(outcome.nodes);
        } catch (error) {
            xpathError.textContent = i18n[currentLang].invalidXpath;
            renderResults([]);
        }
    }

    function parseHtmlContent() {
        if (!ensureCurrentDocument()) {
            renderEmptyState(i18n[currentLang].inputPrompt);
            return;
        }

        if (cssInput.value.trim()) {
            runCSS();
            return;
        }

        if (xpathInput.value.trim()) {
            runXPath();
            return;
        }

        renderEmptyState(i18n[currentLang].inputPrompt);
    }

    function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = event => {
            const content = String(event.target.result ?? '');
            rawInput.value = content;
            rawHtml = content;
            parseHtmlContent();

            if (isPreviewMode) {
                renderPreview();
            } else if (isViewMode) {
                formatAndShow();
            } else {
                setViewMode(true);
            }
        };
        reader.readAsText(file);
    }

    function clearAll() {
        rawHtml = '';
        currentDoc = null;
        currentResults = [];
        nodeLineMap.clear();
        rawInput.value = '';
        cssInput.value = '';
        xpathInput.value = '';
        cssError.textContent = '';
        xpathError.textContent = '';
        document.getElementById('file-upload').value = '';
        modal.classList.remove('active');
        setPreviewMode(false);
        setViewMode(false);
        renderEmptyState(i18n[currentLang].inputPrompt);
    }

    function toggleFullScreen() {
        if (modal.classList.contains('active')) {
            modal.classList.remove('active');
            return;
        }

        const editor = ensureCodeMirror('modal-cm-target');
        let content = rawInput.value;
        if (ensureCurrentDocument()) {
            content = formatDom(currentDoc);
        }

        modal.classList.add('active');
        editor.setValue(content);
        setTimeout(() => editor.refresh(), 30);
    }

    function toggleTheme() {
        const root = document.documentElement;
        const button = document.getElementById('theme-btn');
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';

        if (currentTheme === 'light') {
            root.setAttribute('data-theme', 'light');
            button.textContent = '\u2600\ufe0f';
        } else {
            root.removeAttribute('data-theme');
            button.textContent = '\ud83c\udf19';
        }

        const themeName = currentTheme === 'dark' ? 'darcula' : 'neo';
        if (cmEditor) cmEditor.setOption('theme', themeName);
        if (modalEditor) modalEditor.setOption('theme', themeName);
    }

    function changeLang(lang) {
        currentLang = lang;
        const t = i18n[lang];

        document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
        document.title = t.appTitle;
        document.querySelector('.logo span').textContent = t.title;
        document.getElementById('btn-format').textContent = isViewMode ? t.edit : t.format;
        document.getElementById('btn-preview').textContent = isPreviewMode ? t.visualPickActive : t.visualPick;
        document.getElementById('btn-clear').textContent = t.clear;
        document.getElementById('btn-upload').textContent = t.upload;
        document.querySelector('label[for="css-input"]').textContent = t.cssLabel;
        document.querySelector('label[for="xpath-input"]').textContent = t.xpathLabel;
        document.getElementById('results-title').textContent = t.results;
        document.getElementById('btn-close-modal').textContent = t.close;
        resultHint.textContent = t.resultHint;
        previewHint.textContent = t.previewHint;
        resultPrevBtn.title = t.prevResult;
        resultPrevBtn.setAttribute('aria-label', t.prevResult);
        resultNextBtn.title = t.nextResult;
        resultNextBtn.setAttribute('aria-label', t.nextResult);
        rawInput.placeholder = t.inputPlaceholder;
        cssInput.placeholder = t.cssPlaceholder;
        xpathInput.placeholder = t.xpathPlaceholder;

        if (cssInput.value.trim()) {
            runCSS();
            return;
        }

        if (xpathInput.value.trim()) {
            runXPath();
            return;
        }

        renderEmptyState(t.inputPrompt);
    }

    function isTypingTarget(target) {
        if (!target) return false;
        const tagName = target.tagName;
        if (tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT') return true;
        if (target.isContentEditable) return true;
        return Boolean(target.closest && target.closest('.CodeMirror'));
    }

    function setResizeShield(enabled) {
        // In visual preview mode, the iframe can capture mousemove events while dragging left.
        // Temporarily disable iframe pointer events so the parent document keeps receiving drag events.
        if (previewFrame) {
            previewFrame.style.pointerEvents = enabled ? 'none' : '';
        }
    }

    resizer.addEventListener('mousedown', () => {
        if (window.innerWidth <= 768) return;
        isResizing = true;
        resizer.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        setResizeShield(true);
    });

    document.addEventListener('mousemove', event => {
        if (!isResizing) return;

        const containerWidth = mainContainer.offsetWidth;
        const minWidth = 520;
        const maxWidth = Math.max(minWidth, containerWidth - 220);
        let newLeftWidth = event.clientX - mainContainer.getBoundingClientRect().left;

        newLeftWidth = Math.min(Math.max(newLeftWidth, minWidth), maxWidth);
        leftPanel.style.width = `${(newLeftWidth / containerWidth) * 100}%`;
    });

    function stopResizing() {
        if (!isResizing) {
            setResizeShield(false);
            return;
        }
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        setResizeShield(false);
    }

    document.addEventListener('mouseup', stopResizing);
    window.addEventListener('blur', stopResizing);

    document.addEventListener('keydown', event => {
        if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
        if (isTypingTarget(document.activeElement)) return;
        if (currentResults.length === 0) return;

        event.preventDefault();
        moveResult(event.key === 'ArrowUp' ? -1 : 1);
    });

    resultPrevBtn.addEventListener('click', () => moveResult(-1));
    resultNextBtn.addEventListener('click', () => moveResult(1));

    modal.addEventListener('click', event => {
        if (event.target === modal) {
            modal.classList.remove('active');
        }
    });

    const debouncedParseHtml = debounce(parseHtmlContent, 500);
    const debouncedRunCSS = debounce(runCSS, 300);
    const debouncedRunXPath = debounce(runXPath, 300);

    rawInput.addEventListener('input', debouncedParseHtml);

    cssInput.addEventListener('input', () => {
        xpathInput.value = '';
        xpathError.textContent = '';
        debouncedRunCSS();
    });

    xpathInput.addEventListener('input', () => {
        cssInput.value = '';
        cssError.textContent = '';
        debouncedRunXPath();
    });

    function init() {
        document.getElementById('lang-select').value = currentLang;
        document.getElementById('theme-btn').textContent = '\ud83c\udf19';
        changeLang(currentLang);
    }

    init();
</script>
</body>
</html>
